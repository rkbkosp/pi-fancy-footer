name: Temporary upstream sync validator

on:
  pull_request:
    types:
      - opened
      - edited
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'sync-validator-control' || github.head_ref == 'sync-upstream-20260804'
    runs-on: ubuntu-latest
    steps:
      - name: Check out sync branch
        uses: actions/checkout@v4
        with:
          ref: sync-upstream-20260804
          fetch-depth: 0

      - name: Apply compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:scripts/validate-sync-temp.py > /tmp/validate-sync-temp.py
          python /tmp/validate-sync-temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "fix: reconcile upstream provider status merge"
            git push origin HEAD:sync-upstream-20260804
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
